name: Build lab APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

jobs:
  apk:
    name: Assemble the three lab APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble debug APKs
        run: ./gradlew :app-vulnerable:assembleDebug :app-secure:assembleDebug :app-attacker:assembleDebug --no-daemon

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-run-${GITHUB_RUN_NUMBER}"
          fi
          SHORT_SHA=${GITHUB_SHA::7}
          NOTES="Debug builds from ${SHORT_SHA} for the self-paced labs. app-vulnerable-debug.apk is the victim app (com.hasantuncay.mobsec), app-secure-debug.apk is the hardened twin (com.hasantuncay.mobsec.secure), app-attacker-debug.apk is the simulated malware app (com.hasantuncay.mobsec.attacker). Install with: adb install -r <file>"
          gh release create "${TAG}" --title "Lab APKs ${TAG}" --notes "${NOTES}" \
            app-vulnerable/build/outputs/apk/debug/app-vulnerable-debug.apk \
            app-secure/build/outputs/apk/debug/app-secure-debug.apk \
            app-attacker/build/outputs/apk/debug/app-attacker-debug.apk
