name: Build lab APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: write

jobs:
  apk:
    name: Assemble :app-vulnerable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble :app-vulnerable debug APK
        run: ./gradlew :app-vulnerable:assembleDebug --no-daemon

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-run-${GITHUB_RUN_NUMBER}"
          fi
          SHORT_SHA=${GITHUB_SHA::7}
          NOTES="Debug build of :app-vulnerable (com.hasantuncay.mobsec) from ${SHORT_SHA} for the self-paced labs. Install with: adb install -r app-vulnerable-debug.apk"
          gh release create "${TAG}" --title "Lab APK ${TAG}" --notes "${NOTES}" app-vulnerable/build/outputs/apk/debug/app-vulnerable-debug.apk
